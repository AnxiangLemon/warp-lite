name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout sources
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          lfs: false
          fetch-depth: 2

      - name: Check changed lines
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [[ -z "$BASE_SHA" ]]; then
            BASE_SHA=$(git rev-parse --verify "$HEAD_SHA^" 2>/dev/null || git hash-object -w -t tree /dev/null)
          elif [[ "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git hash-object -w -t tree /dev/null)
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi
          git diff --check "$BASE_SHA" "$HEAD_SHA"

      - name: Check tracked build artifacts
        shell: bash
        run: |
          artifacts=$(git ls-files -- \
            ':(top,glob)target*/**' \
            ':(top,glob)dist/**' \
            ':(top,glob).note/**' \
            ':(top,glob)lite_check*.txt' \
            ':(top).env' \
            ':(top,glob)script/fix_lite_*.py' \
            ':(top,glob)**/ModuleAnalysisCache')
          if [[ -n "$artifacts" ]]; then
            printf 'Remove generated or local files from Git:\n%s\n' "$artifacts"
            exit 1
          fi

      - name: Verify local dependency sources
        run: python3 script/verify-local-sources.py --ledger-only
