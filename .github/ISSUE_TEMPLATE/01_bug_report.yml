name: Bug 反馈
description: 报告 Warp Lite 的可复现问题
body:
  - type: input
    id: version
    attributes:
      label: 版本或 commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 操作系统与 shell
      placeholder: Windows 11 / PowerShell 7
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期行为与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 截图或相关日志
