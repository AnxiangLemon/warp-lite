# Local dependency snapshot; original manifest: Cargo.toml.upstream


["package"]
"edition" = "2018"
"rust-version" = "1.78.0"
"name" = "tink-core"
"version" = "0.3.0"
"authors" = ["David Drysdale <drysdale@google.com>"]
"build" = false
"autolib" = false
"autobins" = false
"autoexamples" = false
"autotests" = false
"autobenches" = false
"description" = "Core crate for Rust port of Google's Tink cryptography library"
"documentation" = "https://docs.rs/tink-core"
"readme" = "README.md"
"keywords" = ["cryptography", "tink"]
"categories" = ["cryptography"]
"license" = "Apache-2.0"
"repository" = "https://github.com/project-oak/tink-rust"
"metadata" = {"docs" = {"rs" = {"all-features" = true, "rustdoc-args" = ["--cfg", "docsrs"]}}}

["features"]
"default" = []
"insecure" = []
"json" = ["tink-proto/json", "serde", "serde_json"]

["lib"]
"name" = "tink_core"
"path" = "src/lib.rs"

["dependencies"]
"digest" = "^0.10.7"
"hkdf" = "^0.12.4"
"lazy_static" = "^1.5"
"rand" = "^0.8"
"sha-1" = "^0.10.1"
"sha2" = "^0.10.9"
"subtle" = "^2.4"
"tink-proto" = "^0.3"
"serde" = {"version" = "^1.0.203", "features" = ["derive"], "optional" = true}
"serde_json" = {"version" = "^1.0.147", "optional" = true}
