# Local dependency snapshot; original manifest: Cargo.toml.upstream
"example" = [{"name" = "fallback", "path" = "examples/fallback.rs"}, {"name" = "list-fonts", "path" = "examples/list-fonts.rs"}, {"name" = "match-font", "path" = "examples/match-font.rs"}, {"name" = "render-glyph", "path" = "examples/render-glyph.rs"}]
"test" = [{"name" = "select_font", "path" = "tests/select_font.rs"}, {"name" = "tests", "path" = "tests/tests.rs"}]

["package"]
"edition" = "2018"
"name" = "font-kit"
"version" = "0.12.0"
"authors" = ["Patrick Walton <pcwalton@mimiga.net>"]
"build" = "build.rs"
"exclude" = ["resources/**"]
"autolib" = false
"autobins" = false
"autoexamples" = false
"autotests" = false
"autobenches" = false
"description" = "A cross-platform font loading library"
"homepage" = "https://github.com/servo/font-kit"
"readme" = "README.md"
"license" = "MIT OR Apache-2.0"
"repository" = "https://github.com/servo/font-kit"

["features"]
"default" = ["source"]
"loader-freetype" = ["freetype"]
"loader-freetype-default" = ["loader-freetype"]
"source" = []
"source-fontconfig" = ["yeslogic-fontconfig-sys"]
"source-fontconfig-default" = ["source-fontconfig"]
"source-fontconfig-dlopen" = ["yeslogic-fontconfig-sys/dlopen"]

["lib"]
"name" = "font_kit"
"path" = "src/lib.rs"

["dependencies"]
"bitflags" = "2.4"
"byteorder" = "1.2"
"float-ord" = "0.3"
"lazy_static" = "1.1"
"libc" = "0.2"
"log" = "0.4.4"
"pathfinder_geometry" = "0.5"
"pathfinder_simd" = "0.5.1"
"freetype" = {"version" = "0.7", "optional" = true}
"yeslogic-fontconfig-sys" = {"version" = "5.0", "optional" = true}

["dev-dependencies"]
"clap" = "4"
"colored" = "2"
"pbr" = "1.0"
"prettytable-rs" = "0.10"

["target"]
"cfg(any(target_os = \"macos\", target_os = \"ios\"))" = {"dependencies" = {"core-foundation" = "0.10.0", "core-graphics" = "0.25.0", "core-text" = "21.0.0"}}
"cfg(not(any(target_arch = \"wasm32\", target_family = \"windows\", target_os = \"android\")))" = {"dependencies" = {"dirs-next" = "2.0"}}
"cfg(not(any(target_family = \"windows\", target_os = \"macos\", target_os = \"ios\")))" = {"dependencies" = {"freetype" = "0.7"}}
"cfg(not(any(target_family = \"windows\", target_os = \"macos\", target_os = \"ios\", target_arch = \"wasm32\")))" = {"dependencies" = {"yeslogic-fontconfig-sys" = "5.0"}}
"cfg(not(target_arch = \"wasm32\"))" = {"dependencies" = {"walkdir" = "2.1"}}
"cfg(target_family = \"windows\")" = {"dependencies" = {"dwrote" = {"default-features" = false, "path" = "../dwrote-0.11.5"}, "winapi" = {"version" = "0.3", "features" = ["dwrite", "minwindef", "sysinfoapi", "winbase", "winnt"]}}}
