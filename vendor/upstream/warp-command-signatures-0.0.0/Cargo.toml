# Local dependency snapshot; original manifest: Cargo.toml.upstream
"bin" = [{"name" = "autogenerate_powershell", "path" = "src/bin/autogenerate_powershell.rs"}]

["package"]
"edition" = "2021"
"name" = "warp-command-signatures"
"version" = "0.0.0"
"authors" = ["Warp Team <dev@warp.dev>"]
"build" = false
"publish" = false
"autolib" = false
"autobins" = false
"autoexamples" = false
"autotests" = false
"autobenches" = false
"readme" = false
"license" = "MIT"

["features"]
"default" = ["embed-signatures"]
"embed-signatures" = ["rayon", "rust-embed"]

["lib"]
"name" = "warp_command_signatures"
"path" = "src/lib.rs"

["dependencies"]
"cfg-if" = "1.0.0"
"itertools" = "0.10.0"
"lazy_static" = "1.4.0"
"log" = "0.4"
"regex" = "1.5.4"
"serde_json" = "1.0"
"serde_with" = "^3.21"
"rayon" = {"version" = "1.5.3", "optional" = true}
"rust-embed" = {"version" = "6.4.2", "features" = ["debug-embed", "include-exclude"], "optional" = true}
"serde" = {"version" = "1.0", "features" = ["derive"]}
"warp-completion-metadata" = {"path" = "../warp-completion-metadata-0.0.0"}
