[package]
authors = ["Warp Team <dev@warp.dev>"]
edition = "2024"
name = "warp_graphql"
version = "0.1.0"
publish.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
chrono.workspace = true
cynic.workspace = true
http_client.workspace = true
futures = { workspace = true, optional = true }
http.workspace = true
instant.workspace = true
log = { workspace = true, optional = true }
persistence.workspace = true
reqwest.workspace = true
serde.workspace = true
thiserror.workspace = true
warp_core.workspace = true
warp_graphql_schema.workspace = true
websocket = { workspace = true, optional = true }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
graphql-ws-client = { workspace = true, features = ["client-cynic", "tungstenite"], optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
graphql-ws-client = { workspace = true, features = ["client-cynic", "ws_stream_wasm"], optional = true }
ws_stream_wasm = { version = "0.7", optional = true }

[dev-dependencies]
http_client = { workspace = true, features = ["test-util"] }

[build-dependencies]
anyhow.workspace = true
cynic-codegen.workspace = true

[features]
default = ["network_transport"]
network_transport = ["http_client/network_transport", "websocket/network_transport", "dep:futures", "dep:log", "dep:websocket", "dep:graphql-ws-client", "dep:ws_stream_wasm"]
# Enables utilities for testing.
test-util = []
