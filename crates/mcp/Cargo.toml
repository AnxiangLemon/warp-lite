[package]
name = "mcp"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
default = ["transports"]
transports = [
    "dep:oauth2",
    "dep:pin-project-lite",
    "dep:reqwest",
    "dep:sse-stream",
    "dep:http",
    "dep:tracing",
    "dep:url",
    "dep:windows",
    "rmcp/auth",
    "rmcp/client-side-sse",
    "rmcp/transport-streamable-http-client-reqwest",
    "rmcp/transport-child-process",
    "tokio/macros",
    "tokio/process",
    "tokio/io-util",
    "tokio/net",
]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
async-trait.workspace = true
cfg-if.workspace = true
cloud_object_models.workspace = true
futures.workspace = true
http = { version = "1", optional = true }
log.workspace = true
oauth2 = { workspace = true, optional = true }
pin-project-lite = { version = "0.2", optional = true }
reqwest = { workspace = true, features = ["json", "stream"], optional = true }
rmcp = { workspace = true, features = ["client"] }
serde.workspace = true
serde_json.workspace = true
simple_logger.workspace = true
sse-stream = { version = "0.2", optional = true }
thiserror.workspace = true
tokio.workspace = true
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }
uuid.workspace = true
warp_core.workspace = true
warp_errors.workspace = true
warpui.workspace = true
warpui_extras = { workspace = true, features = ["default", "user_preferences-toml"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["sync", "rt", "time"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Threading"], optional = true }

[dev-dependencies]
axum.workspace = true
