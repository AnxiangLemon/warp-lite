# Local dependency snapshot; original manifest: Cargo.toml.upstream
"test" = [{"name" = "editor_modified_state", "path" = "tests/editor_modified_state.rs"}, {"name" = "shaping_and_rendering", "path" = "tests/shaping_and_rendering.rs"}, {"name" = "wrap_stability", "path" = "tests/wrap_stability.rs"}, {"name" = "wrap_word_fallback", "path" = "tests/wrap_word_fallback.rs"}]
"bench" = [{"name" = "layout", "path" = "benches/layout.rs", "harness" = false}]

["package"]
"edition" = "2021"
"rust-version" = "1.65"
"name" = "cosmic-text"
"version" = "0.12.0"
"authors" = ["Jeremy Soller <jeremy@system76.com>"]
"build" = false
"autolib" = false
"autobins" = false
"autoexamples" = false
"autotests" = false
"autobenches" = false
"description" = "Pure Rust multi-line text handling"
"documentation" = "https://docs.rs/cosmic-text/latest/cosmic_text/"
"readme" = "README.md"
"license" = "MIT OR Apache-2.0"
"repository" = "https://github.com/pop-os/cosmic-text"
"metadata" = {"docs" = {"rs" = {"features" = ["vi"]}}}

["features"]
"default" = ["std", "swash", "fontconfig"]
"fontconfig" = ["fontdb/fontconfig", "std"]
"no_std" = ["hashbrown", "dep:libm"]
"shape-run-cache" = []
"std" = ["fontdb/memmap", "fontdb/std", "rustybuzz/std", "sys-locale", "ttf-parser/std", "unicode-bidi/std", "rayon"]
"vi" = ["modit", "syntect", "cosmic_undo_2"]
"warn_on_missing_glyphs" = []
"wasm-web" = ["sys-locale?/js"]

["lib"]
"name" = "cosmic_text"
"path" = "src/lib.rs"

["dependencies"]
"bitflags" = "2.4.1"
"log" = "0.4.20"
"rangemap" = "1.4.0"
"self_cell" = "1.0.1"
"unicode-linebreak" = "0.1.5"
"unicode-script" = "0.5.5"
"unicode-segmentation" = "1.10.1"
"cosmic_undo_2" = {"version" = "0.2.0", "optional" = true}
"fontdb" = {"version" = "0.23", "default-features" = false}
"hashbrown" = {"version" = "0.14.1", "optional" = true, "default-features" = false}
"libm" = {"version" = "0.2.8", "optional" = true}
"modit" = {"version" = "0.1.4", "optional" = true}
"rayon" = {"version" = "1", "optional" = true}
"rustc-hash" = {"version" = "1.1.0", "default-features" = false}
"rustybuzz" = {"version" = "0.20.1", "default-features" = false}
"swash" = {"version" = "0.1.17", "optional" = true}
"syntect" = {"version" = "5.1.0", "optional" = true}
"sys-locale" = {"version" = "0.3.1", "optional" = true}
"ttf-parser" = {"version" = "0.25.1", "features" = ["opentype-layout"], "default-features" = false}
"unicode-bidi" = {"version" = "0.3.13", "features" = ["hardcoded-data"], "default-features" = false}

["dev-dependencies"]
"tiny-skia" = "0.11.2"
"criterion" = {"version" = "0.5.1", "features" = ["cargo_bench_support"], "default-features" = false}

["profile"]
"test" = {"opt-level" = 1}
