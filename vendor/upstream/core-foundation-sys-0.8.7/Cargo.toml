# Local dependency snapshot; original manifest: Cargo.toml.upstream


["package"]
"edition" = "2021"
"rust-version" = "1.68"
"name" = "core-foundation-sys"
"version" = "0.8.7"
"authors" = ["The Servo Project Developers"]
"build" = false
"autolib" = false
"autobins" = false
"autoexamples" = false
"autotests" = false
"autobenches" = false
"description" = "Bindings to Core Foundation for macOS"
"readme" = false
"license" = "MIT OR Apache-2.0"
"repository" = "https://github.com/servo/core-foundation-rs"
"metadata" = {"docs" = {"rs" = {"all-features" = true, "default-target" = "x86_64-apple-darwin"}}}

["features"]
"default" = ["link"]
"link" = []
"mac_os_10_7_support" = []
"mac_os_10_8_features" = []

["lib"]
"name" = "core_foundation_sys"
"path" = "src/lib.rs"

["dependencies"]


["lints"]
"clippy" = {"assertions_on_constants" = "allow", "doc_markdown" = "warn", "len_without_is_empty" = "allow", "manual_range_contains" = "allow", "missing_safety_doc" = "allow", "new_ret_no_self" = "allow", "new_without_default" = "allow", "non_canonical_partial_ord_impl" = "allow", "not_unsafe_ptr_arg_deref" = "allow", "result_unit_err" = "allow", "too_many_arguments" = "allow", "type_complexity" = "allow"}
"rust" = {"unexpected_cfgs" = {"level" = "warn", "priority" = 0, "check-cfg" = ["cfg(feature, values(\"cargo-clippy\"))"]}}
