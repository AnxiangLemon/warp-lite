# Local dependency snapshot; original manifest: Cargo.toml.upstream
"bench" = [{"name" = "benchmarks", "path" = "benches/benchmarks.rs"}]

["package"]
"edition" = "2018"
"rust-version" = "1.78.0"
"name" = "tink-hybrid"
"version" = "0.3.0"
"authors" = ["David Drysdale <drysdale@google.com>"]
"build" = false
"autolib" = false
"autobins" = false
"autoexamples" = false
"autotests" = false
"autobenches" = false
"description" = "Hybrid encryption functionality for Rust port of Google's Tink cryptography library"
"documentation" = "https://docs.rs/tink-hybrid"
"readme" = "README.md"
"keywords" = ["cryptography", "tink", "hybrid"]
"categories" = ["cryptography"]
"license" = "Apache-2.0"
"repository" = "https://github.com/project-oak/tink-rust"
"metadata" = {"docs" = {"rs" = {"all-features" = true, "rustdoc-args" = ["--cfg", "docsrs"]}}}

["features"]
"aead" = ["tink-aead"]
"daead" = ["tink-daead"]
"default" = ["aead", "daead"]

["lib"]
"name" = "tink_hybrid"
"path" = "src/lib.rs"

["dependencies"]
"tink-core" = "^0.3"
"tink-proto" = "^0.3"
"p256" = {"version" = "^0.13.2", "features" = ["ecdh"]}
"tink-aead" = {"version" = "^0.3", "optional" = true}
"tink-daead" = {"version" = "^0.3", "optional" = true}
