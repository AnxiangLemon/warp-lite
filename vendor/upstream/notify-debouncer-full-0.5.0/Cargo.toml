# Local dependency snapshot; original manifest: Cargo.toml.upstream


["package"]
"edition" = "2021"
"rust-version" = "1.77"
"name" = "notify-debouncer-full"
"version" = "0.5.0"
"authors" = ["Daniel Faust <hessijames@gmail.com>"]
"build" = false
"autolib" = false
"autobins" = false
"autoexamples" = false
"autotests" = false
"autobenches" = false
"description" = "notify event debouncer optimized for ease of use"
"homepage" = "https://github.com/notify-rs/notify"
"documentation" = "https://docs.rs/notify-debouncer-full"
"readme" = "README.md"
"keywords" = ["events", "filesystem", "notify", "watch"]
"license" = "MIT OR Apache-2.0"
"repository" = "https://github.com/notify-rs/notify.git"

["features"]
"crossbeam-channel" = ["dep:crossbeam-channel", "notify/crossbeam-channel"]
"default" = ["macos_fsevent"]
"macos_fsevent" = ["notify/macos_fsevent"]
"macos_kqueue" = ["notify/macos_kqueue"]
"serde" = ["notify-types/serde"]
"serialization-compat-6" = ["notify/serialization-compat-6"]
"web-time" = ["notify-types/web-time"]

["lib"]
"name" = "notify_debouncer_full"
"path" = "src/lib.rs"

["dependencies"]
"crossbeam-channel" = {"version" = "0.5.0", "optional" = true}
"file-id" = {"version" = "0.2.2", "path" = "../file-id-0.2.2"}
"log" = {"version" = "0.4.17"}
"notify" = {"version" = "8.0.0", "path" = "../notify-8.0.0"}
"notify-types" = {"version" = "2.0.0", "path" = "../notify-types-2.0.0"}
"walkdir" = {"version" = "2.4.0"}

["dev-dependencies"]
"deser-hjson" = {"version" = "2.2.4"}
"pretty_assertions" = {"version" = "1.3.0"}
"rand" = {"version" = "0.8.5"}
"rstest" = {"version" = "0.24.0"}
"serde" = {"version" = "1.0.89", "features" = ["derive"]}
"tempfile" = {"version" = "3.10.0"}
