# Local dependency snapshot; original manifest: Cargo.toml.upstream
"example" = [{"name" = "parselog", "path" = "examples/parselog.rs"}]

["package"]
"edition" = "2021"
"rust-version" = "1.62.1"
"name" = "vte"
"version" = "0.13.0"
"authors" = ["Joe Wilm <joe@jwilm.com>", "Christian Duerr <contact@christianduerr.com>"]
"build" = false
"exclude" = ["/.travis.yml"]
"autolib" = false
"autobins" = false
"autoexamples" = false
"autotests" = false
"autobenches" = false
"description" = "Parser for implementing terminal emulators"
"documentation" = "https://docs.rs/vte/"
"readme" = "README.md"
"keywords" = ["ansi", "vte", "parser", "terminal"]
"categories" = ["parsing", "no-std"]
"license" = "Apache-2.0 OR MIT"
"repository" = "https://github.com/alacritty/vte"

["features"]
"ansi" = ["log", "cursor-icon", "bitflags"]
"default" = ["no_std"]
"nightly" = ["utf8parse/nightly"]
"no_std" = ["arrayvec"]
"serde" = ["dep:serde"]

["lib"]
"name" = "vte"
"path" = "src/lib.rs"

["dependencies"]
"arrayvec" = {"version" = "0.7.2", "optional" = true, "default-features" = false}
"bitflags" = {"version" = "2.3.3", "optional" = true, "default-features" = false}
"cursor-icon" = {"version" = "1.0.0", "optional" = true, "default-features" = false}
"log" = {"version" = "0.4.17", "optional" = true}
"serde" = {"version" = "1.0.160", "features" = ["derive"], "optional" = true}
"utf8parse" = {"version" = "0.2.0", "path" = "../utf8parse-0.2.1"}
"vte_generate_state_changes" = {"version" = "0.1.0", "path" = "../vte_generate_state_changes-0.1.1"}
