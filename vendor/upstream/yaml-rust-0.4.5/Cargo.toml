# Local dependency snapshot; original manifest: Cargo.toml.upstream
"example" = [{"name" = "dump_yaml", "path" = "examples/dump_yaml.rs"}]
"test" = [{"name" = "quickcheck", "path" = "tests/quickcheck.rs"}, {"name" = "spec_test", "path" = "tests/spec_test.rs"}, {"name" = "test_round_trip", "path" = "tests/test_round_trip.rs"}]

["package"]
"edition" = "2018"
"name" = "yaml-rust"
"version" = "0.4.5"
"authors" = ["Yuheng Chen <yuhengchen@sensetime.com>"]
"build" = false
"autolib" = false
"autobins" = false
"autoexamples" = false
"autotests" = false
"autobenches" = false
"description" = "The missing YAML 1.2 parser for rust"
"homepage" = "http://chyh1990.github.io/yaml-rust/"
"documentation" = "https://docs.rs/yaml-rust"
"readme" = "README.md"
"license" = "MIT/Apache-2.0"
"repository" = "https://github.com/chyh1990/yaml-rust"

["lib"]
"name" = "yaml_rust"
"path" = "src/lib.rs"

["dependencies"]
"linked-hash-map" = "0.5.3"

["dev-dependencies"]
"quickcheck" = "0.9"
