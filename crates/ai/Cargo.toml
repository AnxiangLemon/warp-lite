[package]
name = "ai"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
default = ["runtime"]
runtime = [
    "dep:async-channel", "dep:async-trait", "dep:bincode", "dep:bytes", "dep:cfg-if",
    "dep:computer_use", "dep:dunce", "dep:prost-types", "dep:serde_json", "dep:serde_yaml",
    "dep:string-offset", "dep:typed-path", "dep:base16ct", "dep:streaming-iterator",
    "dep:instant", "dep:itertools", "dep:rayon", "dep:ignore", "dep:line-span", "dep:log",
    "dep:shellexpand", "dep:strum", "dep:strum_macros", "dep:warpui_core", "dep:warpui_extras",
    "dep:warp_graphql", "dep:warp_multi_agent_api", "dep:dirs", "dep:lazy_static", "dep:regex",
    "dep:rmcp", "dep:sha2", "dep:strsim", "dep:thiserror", "dep:tokio", "dep:futures",
    "dep:generic-array", "dep:derivative", "dep:warp_core", "dep:warp_errors",
    "dep:warp_terminal", "dep:warp_util", "dep:priority-queue", "dep:repo_metadata",
    "dep:unicode-width", "dep:nix", "dep:async-fs", "dep:arborium", "dep:base64",
    "dep:http_client", "dep:languages", "dep:rand", "dep:serde_urlencoded", "dep:syntax_tree",
    "dep:watcher", "dep:notify-debouncer-full",
    "languages/parsing", "syntax_tree/tree_sitter_types",
]
jemalloc = []
local_fs = []
test-util = []
crash_reporting = ["dep:sentry"]

[dependencies]
async-channel = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }
bincode = { workspace = true, optional = true }
bytes = { workspace = true, optional = true }
cfg-if = { workspace = true, optional = true }
computer_use = { workspace = true, optional = true }
dunce = { workspace = true, optional = true }
prost-types = { workspace = true, optional = true }
serde.workspace = true
serde_json = { workspace = true, optional = true }
serde_yaml = { workspace = true, optional = true }
string-offset = { workspace = true, optional = true }
typed-path = { workspace = true, optional = true }
anyhow.workspace = true
base16ct = { version = "0.2.0", optional = true }
streaming-iterator = { workspace = true, optional = true }
instant = { workspace = true, optional = true }
itertools = { workspace = true, optional = true }
rayon = { workspace = true, optional = true }
ignore = { version = "0.4.23", optional = true }
line-span = { version = "0.1.5", optional = true }
log = { workspace = true, optional = true }
sentry = { workspace = true, optional = true }
shellexpand = { workspace = true, optional = true }
strum = { workspace = true, optional = true }
strum_macros = { workspace = true, optional = true }
warpui_core = { workspace = true, optional = true }
warpui_extras = { workspace = true, features = ["default"], optional = true }
warp_graphql = { workspace = true, optional = true }
warp_multi_agent_api = { workspace = true, optional = true }
dirs = { workspace = true, optional = true }
lazy_static = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rmcp = { workspace = true, features = ["client"], optional = true }
sha2 = { version = "0.10.8", optional = true }
strsim = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt"], optional = true }
futures = { workspace = true, optional = true }
generic-array = { version = "0.14.7", optional = true }
derivative = { workspace = true, optional = true }
warp_core = { workspace = true, optional = true }
warp_errors = { workspace = true, optional = true }
warp_terminal = { workspace = true, optional = true }
warp_util = { workspace = true, optional = true }
chrono.workspace = true
persistence.workspace = true
priority-queue = { version = "2.3.1", optional = true }
repo_metadata = { workspace = true, optional = true }
uuid.workspace = true
unicode-width = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-fs = { workspace = true, optional = true }
arborium = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
http_client = { workspace = true, optional = true }
languages = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
serde_urlencoded = { workspace = true, optional = true }
syntax_tree = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread"], optional = true }
watcher = { workspace = true, optional = true }
notify-debouncer-full = { workspace = true, optional = true }

[dev-dependencies]
filetime = "0.2.25"
serial_test = "0.8.0"
tempfile.workspace = true
virtual-fs.workspace = true
warp_core = { workspace = true, features = ["test-util"] }

[build-dependencies]
anyhow.workspace = true
