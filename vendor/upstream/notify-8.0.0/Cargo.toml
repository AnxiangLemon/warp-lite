# Local dependency snapshot; original manifest: Cargo.toml.upstream
"test" = [{"name" = "watch_filter", "path" = "tests/watch_filter.rs"}]

["package"]
"edition" = "2021"
"rust-version" = "1.77"
"name" = "notify"
"version" = "8.0.0"
"authors" = ["F茅lix Saparelli <me@passcod.name>", "Daniel Faust <hessijames@gmail.com>", "Aron Heinecke <Ox0p54r36@t-online.de>"]
"build" = false
"autolib" = false
"autobins" = false
"autoexamples" = false
"autotests" = false
"autobenches" = false
"description" = "Cross-platform filesystem notification library"
"homepage" = "https://github.com/notify-rs/notify"
"documentation" = "https://docs.rs/notify"
"readme" = "../README.md"
"keywords" = ["events", "filesystem", "notify", "watch"]
"categories" = ["filesystem"]
"license" = "CC0-1.0"
"repository" = "https://github.com/notify-rs/notify.git"

["features"]
"default" = ["macos_fsevent"]
"macos_fsevent" = ["fsevent-sys"]
"macos_kqueue" = ["kqueue", "mio"]
"serde" = ["notify-types/serde"]
"serialization-compat-6" = ["notify-types/serialization-compat-6"]

["lib"]
"name" = "notify"
"path" = "src/lib.rs"

["dependencies"]
"crossbeam-channel" = {"version" = "0.5.0", "optional" = true}
"filetime" = {"version" = "0.2.22"}
"libc" = {"version" = "0.2.4"}
"log" = {"version" = "0.4.17"}
"notify-types" = {"version" = "2.0.0", "path" = "../notify-types-2.0.0"}
"walkdir" = {"version" = "2.4.0"}

["dev-dependencies"]
"insta" = {"version" = "1.34.0"}
"nix" = {"version" = "0.29.0"}
"serde_json" = {"version" = "1.0.39"}
"tempfile" = {"version" = "3.10.0"}

["target"]
"cfg(any(target_os=\"freebsd\", target_os=\"openbsd\", target_os = \"netbsd\", target_os = \"dragonflybsd\", target_os = \"ios\"))" = {"dependencies" = {"kqueue" = {"version" = "1.0.8"}, "mio" = {"version" = "1.0", "features" = ["os-ext"]}}}
"cfg(any(target_os=\"linux\", target_os=\"android\"))" = {"dependencies" = {"inotify" = {"version" = "0.11.0", "default-features" = false}, "mio" = {"version" = "1.0", "features" = ["os-ext"]}}}
"cfg(target_os=\"macos\")" = {"dependencies" = {"bitflags" = {"version" = "2.7.0"}, "fsevent-sys" = {"version" = "4.0.0", "optional" = true}, "kqueue" = {"version" = "1.0.8", "optional" = true}, "mio" = {"version" = "1.0", "features" = ["os-ext"], "optional" = true}}}
"cfg(windows)" = {"dependencies" = {"windows-sys" = {"version" = "0.59.0", "features" = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_WindowsProgramming", "Win32_System_IO"]}}}
