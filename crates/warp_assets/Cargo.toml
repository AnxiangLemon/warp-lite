[package]
name = "warp_assets"
version = "0.0.0"
edition = "2024"
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
lite = ["dep:rust-embed-compressed"]
standalone = []

[dependencies]
anyhow.workspace = true
rust-embed.workspace = true
warpui_core.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
rust-embed-compressed = { package = "rust-embed", version = "=6.8.1", default-features = false, features = ["compression", "include-exclude"], optional = true }

[target.'cfg(target_family = "wasm")'.dependencies]
# Make sure we embed the data into the wasm binary even when running in debug
# mode, as it cannot be read directly from the filesystem.
rust-embed = { workspace = true, features = ["debug-embed"] }
